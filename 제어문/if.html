<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if</title>
</head>

<body>
    <h1>자바스크립트 제어문</h1>
    <h2>if 조건문</h2>
    <p>
        만약 (if) 조건이 맞으면 코드를 실행하는 구문.
    </p>
    <code>
        if (조건식) {
            실행할 코드;
        }
    </code>
    <div class="result"></div>

    <script>
        let age = 15;
        if (age >= 20) {
            //무조건 true가 실행
            console.log("성인입니다.")
        } else {
            console.log("미성년자입니다.")
        }

        //if ~ else if ~ else -> 조거닝 여러개인 경우
        let score = 85;
        if (score >= 90) {
            console.log(`${score}점 A등급입니다.`)
        } else if (score >= 80) {
            console.log(`${score}점 B등급입니다.`)
        }
        else if (score >= 70) {
            console.log(`${score}점 C등급입니다.`)
        }
        else {
            console.log(`재평가 대상입니다.`)
        }

        let inputNum = prompt(`확인합니다.`, `0 이상의 숫자를 입력해주세요`);
        /*     console.log(`입력한 숫자는 ${inputNum}입니다.`) */

        const result = document.querySelector('.result');

        result.innerHTML = `입력한 숫자는<strong>${inputNum}</strong>입니다.`

        let scoreA = 85;
        if (scoreA >= 80) {
            result.innerText = `합격입니다.`
        } else {
            result.innerText = `불합격입니다.`
        }

        //논리연산자
        let userAge = 22;
        let gender = `여자`
        if (userAge >= 20 && gender == "여") {
            result.innerHTML = `<strong>성인여성입니다.<strong>
        `} else {
            result.innerText = `탈락입니다`
        }

        //쇼핑몰 할인
        let price = 15000;
        if (price >= 50000) {
            alert("5만원 이상은 무료배송입니다.")
        } else {
            alert("무료 배송은 5만원부터 입니다.")
        }

        //로그인 예제
        let id = "admin";
        let pwd = '1234';

        if (id == "admin" && pwd == "1234") {
            console.log("로그인되었습니다.")
            result.innerText = "로그인되었습니다."
        } else {
            console.log("아이디 또는 비밀번호가 틀렸습니다.")
        }

        //입력한 숫자가 짝수/홀수인지 판단
        let userNum = prompt(`0이상의 4자리를 입력해주세요.`);

        if (userNum % 2 === 0) {
            console.log(`짝수 차량은 A구역입니다.`)
        } else {
            console.log(`홀수 차량은 B구역입니다.`)
        }
    </script>
</body>

</html>
