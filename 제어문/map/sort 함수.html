<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sort()</title>
</head>

<body>
    <script>
        /* 
            sort() - 배열안의 데이터 순서를 정렬하는 메소드
            메소드는 주체가 필요하다
            배열.sort()
            - 숫자나 객체를 정렬할 때는 비교함수를 포함 
            배열.sort((a,b)=> {
            return a-b
            }) --> .a , b는 배열에서 비교할 두 개의 값
        */

        const numbers = [30, 10, 20, 50, 80];
        numbers.sort((a, b) => {
            //작은 값 -> 큰 값
            return a - b;
            /* 
                30 - 10 = 20 (양수) a가 b보다 뒤 : 10 , 30
                30 - 20 = 10 (양수) a가 b보다 뒤 : 10 , 20
                30 - 50 = -20 (음수) a가 b보다 앞 : 10,20,30,50
                50 - 40 = 10 (양수) a가 b보다 뒤 : 40,50
            */
        })
        console.log(numbers)
    </script>
</body>

</html>
