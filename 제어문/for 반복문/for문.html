<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for 반복문</title>
</head>

<body>
    <div id="list"></div>

    <div id="buttons"></div>
    <div id="gallery"></div>
    <div id="star"></div>
    <ul id="num-list"></ul>
    <script>
        /* 
        for(초기값; 조건식; 증감값){
        실행문
        } 
        */
        for (let i = 1; i <= 5; i++) {
            console.log("i:", i)
        }

        let products = ["노트북", "마우스", "키보드", "스피커"];
        /* console.log(products[2]); */

        let list = document.querySelector("#list");
        for (let i = 0; i < products.length; i++) {
            list.innerHTML += `
            <div class='card'>${products[i]}</div>
            `
        }

        /* 10번 출력 */
        for (let i = 1; i <= 10; i++) {
            console.log("i:", i);
        }

        /* 버튼 5개 만들기 */
        let buttonBox = document.querySelector("#buttons");

        for (let i = 1; i <= 5; i++) {
            buttonBox.innerHTML += `<button>버튼${i}</button>`
        }

        /* 이미지 여러개 */
        let gallery = document.querySelector("#gallery")

        for (let i = 1; i <= 4; i++) {
            gallery.innerHTML += `
            <img src='https://picsum.photos/200?random=${i}'>
            `
        }

        /* 별점 출력 */
        let star = '';
        for (let i = 1; i <= 5; i++) {
            star += "⭐"
            console.log(star)
        }
        document.querySelector("#star").textContent = star

        /* 짝수만 출력 */
        for (let i = 2; i <= 10; i += 2) {
            console.log(i)
        }

        /* 숫자목록 */
        let numList = document.querySelector("#num-list");
        for (let i = 1; i <= 5; i++) {
            numList.innerHTML += `<li>${i}번째 메뉴</li>`
        }
    </script>
</body>

</html>
