<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 모달창</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            padding: 50px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .form-select {
            margin-bottom: 30px;
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .modal-box {
            width: 25%;
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        #closeBtn {
            margin-top: 20px;
            padding: 10x 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>상품구매</h2>
        <select class="form-select" aria-label="Default select example" id="select_count">
            <option value="0">수량선택</option>
            <option value="1">1개</option>
            <option value="2">2개</option>
            <option value="3">3개</option>
        </select>
        <button type="button" class="btn btn-danger" id="cartBtn">장바구니 담기</button>
    </div>

    <!-- 모달창 -->
    <div id="modal">
        <div class="modal-box">
            <h2>장바구니</h2>
            <p id="message"></p>
            <button type="button" class="btn btn-dark" id="closeBtn">확인</button>
        </div>
    </div>

    <script>
        //선택자를 변수에 저장
        const cartBtn = document.querySelector("#cartBtn");
        const closeBtn = document.querySelector("#closeBtn");
        const modal = document.querySelector("#modal");
        const message = document.querySelector("#message");

        cartBtn.addEventListener('click', function () {
            const selCount = Number(document.querySelector('#select_count').value);
            const stock = 2;

            if (selCount === 0) {
                message.textContent = '상품 수량을 선택해주세요'
            } else if (selCount > stock) {
                message.textContent = '재고가 부족합니다'
            } else {
                message.textContent = `상품${selCount}개가 바구니에 담겼습니다.`
            }
            modal.style.display = 'flex';
        })
        closeBtn.addEventListener('click', function () {
            modal.style.display = 'none';
        })
    </script>
</body>

</html>
