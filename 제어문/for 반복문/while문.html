<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while문</title>
</head>

<body>

    <script>
        let num = 10;
        while (num <= 5) {
            console.log(`while:${num}`);
            num++
        }

        //do while
        let nums = 10;
        do {
            console.log(nums);
            nums++
        } while (nums <= 5)


    </script>
</body>

</html>
