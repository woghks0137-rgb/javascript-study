<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for 리뷰</title>
</head>

<body>
    <button id="btn-order">주문하기</button>
    <div id="result"></div>

    <script>
        const menus = ["아메리카노", "카페라테", "카푸치노", "바닐라라떼"];
        const btnOrder = document.querySelector("#btn-order");
        const result = document.querySelector("#result");

        //for-of로 개별 요소로 출력
        /* 버튼을 클릭하면 result에 "메뉴명을 주문했습니다." */
        /* 1. 버튼을 클릭 */
        /* 2. 배열에 있는 각 요소를 개별변수로 저장 */
        /* 3. 개별변수에 저장된 내용을  result에 출력 */

        btnOrder.addEventListener("click", function () {
            for (let menu of menus) {
                result.innerHTML += `
                ${menu}를 주문했습니다. </br>
                `
            }
        })


    </script>
</body>

</html>
