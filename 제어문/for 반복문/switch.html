<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch 구문</title>
</head>

<body>
    <script>
        let day = "월";

        switch (day) {
            case "월":
                console.log("출근");
                break;

            case "토":
                console.log("주말");
                break;

            case "일":
                console.log("휴일");
                break;

            default:
                console.log("평일")
        }
    </script>
</body>

</html>
