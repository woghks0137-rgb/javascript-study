<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항연산자</title>

</head>

<body>
    <button id="btn">확인</button>
    <button id="btn2">확인</button>
    <p id="result"></p>
    <script>
        const age = 20;

        if (age >= 20) {
            result = "성인입니다."
        } else {
            result = "미성년자입니다."
        }
        console.log(result);

        const isLogin = false;
        const btn = document.querySelector("#btn")
        const results = document.querySelector("#result")

        btn.addEventListener("click", () => {
            results.textContent = isLogin ? "환영합니다" : "로그인 해주세요."
        })

        const btn2 = document.querySelector("#btn2")

        let dark = false;
        btn2.addEventListener("click", () => {
            dark = !dark; /* 들어오는 값의 무조건 반대 -> 토글처럼 쓸 때 선언 */
            console.log(dark)
            btn2.style.backgroundColor = dark ? "black" : "skyblue";
            btn2.style.color = dark ? "white" : "black";
        })
    </script>
</body>

</html>
