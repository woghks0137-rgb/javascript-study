<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체배열</title>
</head>

<body>
    <script>
        /* 객체명 = {속성 : 값 , 속성 : 값} */
        const dog = {
            name: '초코',
            age: 3,
            bredd: '푸들'
        }
        console.log(dog)
        console.log(dog.name)
        console.log(dog.age)
        /*   document.querySelector("p").textContent = dog.name */

        /* 객체배열 - 2개 이상의 객체 정보를 담은 저장소 */
        const dogs = [
            {
                name: '초코',
                age: 3,
                bredd: '푸들'
            },
            {
                name: '보리',
                age: 2,
                bredd: '말티즈'
            },
            {
                name: '탄이',
                age: 3,
                bredd: '캘피'
            }
        ]
        console.log(dogs)
        console.log(dogs[0].name);
        console.log(dogs[1].age);
        console.log(dogs[2].bredd);

        for (let dog of dogs) {
            console.log(dog)
            console.log(dog.name)
            console.log(dog.bredd)
        }

        /*  function showDog(dog) {
             console.log('이름', dog.name)
             console.log('나이', dog.age)
             console.log('견종', dog.bredd)
         }
         showDog(dogs[0]) */

        //객체배열+반복문+함수
        function showDog(dog) {
            console.log('이름', dog.name)
            console.log('나이', dog.age)
            console.log('견종', dog.bredd)
        }
        for (let dog of dogs) {
            showDog(dog)
        }
    </script>
</body>

</html>
