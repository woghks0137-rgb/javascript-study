<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>breadcrumb</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="location">
        <nav aria-label="현재 위치">
            <ul class="location-list">
                <li class="home">
                    <a href="#" aria-label="홈">HOME</a>
                </li>
                <li class="location-item">
                    <button type="button" class="location-btn" aria-expanded="false">이벤트</button>
                    <ul class="location-sub">
                        <li><a href="#">알뜰폰 파트너스</a></li>
                        <li><a href="#">요금제</a></li>
                        <li><a href="#">이벤트</a></li>
                    </ul>
                </li>
                <li class="location-item">
                    <button type="button" class="location-btn" aria-expanded="false">진행중 이벤트</button>
                    <ul class="location-sub">
                        <li><a href="#">진행중인 이벤트</a></li>
                        <li><a href="#">지난 이벤트</a></li>
                        <li><a href="#">당첨자 발표</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </div>
</body>

</html>
