<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 수량 연습</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        button {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .product-card {
            width: 420px;
            padding: 40px;

            background: #fff;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .category {
            display: block;
            margin-bottom: 8px;

            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .product-info h2 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        .price {
            color: #666;
            font-size: 18px;
        }

        .quantity-box {
            margin: 35px 0;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .quantity-box button {
            width: 45px;
            height: 45px;

            background: #222;
            color: #fff;

            border-radius: 50%;

            font-size: 22px;
        }

        .quantity-box button:hover {
            background: #555;
        }

        .quantity {
            min-width: 30px;

            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .total-box {
            padding-top: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-top: 1px solid #ddd;
        }

        .total-box span {
            color: #777;
        }

        .total-price {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <main class="cart">
        <div class="product-card">

            <div class="product-info">
                <span class="category">KEYBOARD</span>
                <h2>무선 키보드</h2>
                <p class="price">35,000원</p>
            </div>

            <div class="quantity-box">
                <button type="button" class="minus-btn">−</button>

                <span class="quantity">1</span>

                <button type="button" class="plus-btn">+</button>
            </div>

            <div class="total-box">
                <span>총 금액</span>
                <strong class="total-price">35,000원</strong>
            </div>

        </div>
    </main>

</body>

</html>
