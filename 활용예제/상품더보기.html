<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품더보기</title>
    <style>
        .container {
            width: 500px;
            height: 500px;
            margin: auto;
            text-align: center;
        }

        img {
            width: 100%;
            height: 70%;
        }

        .text.top {
            border: 1px solid black;

        }

        .text {
            padding: 20px;
        }

        .hide {
            display: none;
            background: skyblue;
        }

        .text.hide.show {
            display: block;
        }

        #btn {
            padding: 10px 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>건강한 식생활</h1>
        <img src="/제어문/for 반복문/img/img01.png" alt="">
        <p class="text top">
            정확한 진단과 효과적인 치료를 제공하는 경험 많은 의료 전문가를 신뢰하세요. 최신 의학 연구와 혁신적인 기술을 활용하여 최상의 결과를 보장합니다. 환자 안전과 편안함은 저희가 하는 모든 일의
            중심입니다.
        </p>
        <button id="btn">더보기</button>
        <p class="text hide">
            최첨단 의료 기술과 숙련된 의사로 제공되는 고급 의료 솔루션. 저희 의료 시설은 포괄적인 진단 서비스, 전문 치료 및 개인화된 치료 계획을 제공합니다. 최첨단 장비와 증거 기반 의학으로 환자
            복지를 우선시합니다.
        </p>
    </div>

    <script>
        const btn = document.querySelector("#btn");
        const text = document.querySelector(".hide")

        btn.addEventListener("click", function () {
            text.classList.toggle("show")
            /*     if (text.classList.contains('show')) {
                    btn.textContent = "접기"
                } else {
                    btn.textContent = "더보기"
                } */

        })
    </script>
</body>

</html>
