<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스오버텍스트효과</title>

    <style>
        body {
            padding: 1rem;
        }

        .text {
            background: #333;
            color: #fff;
            padding: .5rem 1rem;
            margin: 2rem auto;
            text-align: center;
            width: fit-content;
            border-radius: .5rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(4rem, 1fr));
            gap: 2rem;
            max-width: 48rem;
            margin: auto;
        }

        .gallery img {
            max-width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            transition: .5s;
        }

        .gallery img:hover {
            box-shadow: 0 .25rem 1rem rgba(0, 0, 0, .5);
        }
    </style>
</head>

<body>
    <p class="text">과일쥬스 세트</p>
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="오렌지 레몬 주스">
        <img src="https://images.unsplash.com/photo-1614707585284-9cb9fc018387?q=80&w=790&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="레인보우 쥬스">
        <img src="https://images.unsplash.com/photo-1615478503562-ec2d8aa0e24e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fCVFQyVBNSVBQyVFQyU4QSVBNHxlbnwwfHwwfHx8MA%3D%3D"
            alt="블루베리 스무디">

        <script>
            const images = document.querySelectorAll(".gallery img");
            console.log(images)

            const text = document.querySelector(".text");
            for (let image of images) {
                //console.log(image)
                image.addEventListener('mouseover', (event) => {
                    text.textContent = event.target.alt;
                    event.target.animate({
                        opacity: [0, 1]
                    }, 500
                    )
                })

            }
        </script>
    </div>
</body>

</html>
