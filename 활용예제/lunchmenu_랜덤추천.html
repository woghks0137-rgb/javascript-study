<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점심메뉴 추천받기</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 40px;
            text-align: center;
            border: 1px solid #bbb;
        }

        h1 {
            margin-bottom: 20px;
        }

        #menu-result {
            min-height: 60px;
            margin: 30px 0;
            padding: 25px;
            font-size: 18px;
            font-weight: 500;
            background: rosybrown;
            color: #fff;
        }

        #recomBtn {
            padding: 14px 24px;
            background: #ff9f43;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍱 오늘의 점심 추천</h1>
        <div id="menu-result">
            추천버튼을 눌러주세요
        </div>
        <button id="recomBtn">메뉴 추천받기</button>
    </div>

    <script>
        /* 
            1. 선택자변수 저장
            2. 배열로 랜덤하게 메뉴 5개를 지정            
            3. 버튼을 눌렀을 때 menu-result 영역에 "오늘의 메뉴는 ~입니다"에 출력되도록 if 구문으로 작성     
            3-1. for..of구문으로 배열의 요소들을 개별 요소로 저장   
        */
        const menu = document.querySelector("#menu-result");
        const recomBtn = document.querySelector("#recomBtn");
        const menuList = [
            '제육볶음',
            '소세지야채볶음',
            '돈까스',
            '초밥',
            '냉면'
        ]
        console.log(menuList)
        recomBtn.addEventListener("click", function () {
            //0부터 4까지의 랜덤 숫자 
            const rendomNumber = Math.floor(Math.random() * menuList.length);
            console.log(rendomNumber)

            //랜덤숫자를 배열 번호로 사용
            const selectedMenu = menuList[rendomNumber];
            console.log(selectedMenu)

            //선택된 메뉴에 따라 문장
            if (selectedMenu === '제육볶음') {
                menu.textContent = '매콤하고 달짝지근한 제육볶음 추천합니다.'
            }
            else if (selectedMenu === '소세지야채볶음') {
                menu.textContent = '달콤하고 맛있는 소야 추천합니다.'
            }
            else if (selectedMenu === '돈까스') {
                menu.textContent = '이건 굳이 설명이 필요없죠 돈까스 먹으세요.'
            }
            else if (selectedMenu === '초밥') {
                menu.textContent = '저는 초밥 좋아해요 초밥 드세요.'
            }
            else {
                menu.textContent = `먹을 거 없으면 ${selectedMenu}추천할게요.`
            }

        })



    </script>
</body>

</html>
