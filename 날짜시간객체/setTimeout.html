<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout함수</title>
    <style>
        body {
            padding: 100px;
        }

        /* 이벤트창 */
        .event-popup {
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #cddddd;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <h1>쇼핑몰 메인 페이지</h1>
    <p>페이지에 접속하면 3초 후 이벤트 알림창이 나타납니다.</p>

    <div class="event-popup">
        <h2>EVENT</h2>
        <p>신규회원 가입이 10% 할인 쿠폰을 드립니다.</p>
        <button class="close-btn">닫기</button>
    </div>
    <script>
        /*  function hello() {
             console.log("안녕하세요.")
         }
         setTimeout(hello, 3000) */
        /*  const time = setTimeout(() => {
             console.log("3초가 지났습니다")
         }, 3000)
 
         clearTimeout(time) */

        const popup = document.querySelector(".event-popup");
        const btnClose = document.querySelector(".close-btn");

        //3초 후 이벤트 팝업 보여주기
        setTimeout(() => {
            popup.style.display = 'block'
        }, 3000)
        btnClose.addEventListener("click", () => {
            popup.style.display = 'none'
        })
    </script>
</body>

</html>
