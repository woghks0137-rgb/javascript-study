<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평가5</title>
    <link rel="stylesheet" href="css/style5.css">
    <script src="js/script5.js" defer></script>
</head>

<body>
    <header>
        <div class="text-group">
            <h1 class="main-text">평가 5. 가격 정렬</h1>
            <p class="sub-text">sort()로 가격 순서를 변경합니다</p>
        </div>
    </header>
    <div class="inner">
        <p class="event-text">평가 목표 : select의 value를 읽고 spread로 원본 배열을 복사한 뒤 sort() 비교함수로 낮은순/높은순 정렬을 할 수 있는가?</p>
        <select class="sort-select">
            <option value="default">기본순</option>
            <option value="price-low">낮은 가격순</option>
            <option value="price-high">높은 가격순</option>
        </select>
        <ul class="card-list"></ul>
    </div>
</body>

</html>
