<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자</title>
</head>

<body>
    <h1 id="title">안녕하세요</h1>
    <button onclick="changeText()">변경하기</button>

    <p class="text">html</p>
    <p class="text">css</p>
    <p class="text">javascript</p>

    <ul>
        <li>강아지</li>
        <li>고양이</li>
        <li>햄스터</li>
    </ul>

    <script>
        /* 함수 -> 필요할 때마다 실행할 수 있도록 묶어놓은 코드 */
        function changeText() {
            const title = document.getElementById("title")
            title.innerText = "반갑습니다."
        }

        /* 변수는 값을 하나만 저장할 수 있다. */
        const text = document.getElementsByClassName("text");
        console.log(text)
        console.log(text[2].innerText)

        const li = document.getElementsByTagName("li")
        console.log(li[1].innerText)

        //여러개의 동일한 선택자가 있을 경우 querySelector로 호출을 하면 무조건 첫번째 요소만 출력이 됨.
        //querySelectorAll로 호출하면 동일한 요소들이 모두 호출되므로 개별적인 호출을 할 때는 [](배열의 인덱스번호)로 호출하도록 한다.
        const text2 = document.querySelectorAll("li")
        console.log(text2[1].innerText) /* 안에 내용을 보고 싶으면 .innerText를 사용한다 */

        /*
            1) getElement ~~ 로 선택자를 호출할 때는 id , class , tag , name 등 여러 종류별로 호출할 수 있다.
            2) querySelector는 css 선택자 그대로 호출하므로 최근에는 querySelector 호출방식을 쓰고 있다.
            3) querySelector 방식으로 호출할 때는 반드시 선택자이 구분자를 명확하게 써줘야한다.
        */

    </script>

</html>
