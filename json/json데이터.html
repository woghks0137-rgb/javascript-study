<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json 데이터</title>
</head>

<body>
    <script>
        //json은 데이터를 저장하거나 주고받기 위해 사용하는 문자형식
        //javascript 데이터를 다른 곳에서도 전달하고 읽을 수 있도록 
        //object
        const user = {
            name: "민지",
            age: 24,
            job: "웹디자이너"
        }
        //이름과 직업을 추력
        console.log(user.name, user.job)

        const hobbys = ["영화", "쇼핑", "여행"];
        console.log(hobbys[1])

        //json
        const userInfo = {
            "name": "민지",
            "age": 24,
            "job": "웹디자이너",
            "address": {
                "city": "서울",
                "gu": "마포구"
            }
        }
        const movies = [
            {
                id: 1,
                title: "인사이드 아웃",
                genre: "애니메이션",
                year: 2024,
                rating: 8.7
            },
            {
                id: 2,
                title: "파묘",
                genre: "미스터리",
                year: 2024,
                rating: 8.2
            },
            {
                id: 3,
                title: "서울의 봄",
                genre: "드라마",
                year: 2023,
                rating: 9.0
            },
            {
                id: 4,
                title: "엘리멘탈",
                genre: "애니메이션",
                year: 2023,
                rating: 8.6
            }
        ];

        //배열에서 데이터 가져오기
        //첫 번째 데이터 영화제목
        console.log(movies[2].rating)

        //map() - 새로운 배열로 출력
        //forEach() - 개별요소로 출력
        movies.forEach((movie) => {
            console.log(movie.title)
        })

        //filter => 애니메이션만 출력
        const animationMovie = movies.filter((movie) => {
            return movie.genre === "애니메이션"

        })
        console.log("filter:", animationMovie)

        //find -> 파묘
        const ani = movies.find((movie) => {
            return movie.title === "파묘"
        })
        console.log(ani.genre)

        //sort -> 평점이 높은순 -> 내림차순
        //sort() -> 배열을 새로 복사해서 쓴다 -> spread(원본 보존)
        const sortMovies = [...movies];
        console.log(sortMovies)
        sortMovies.sort((a, b) => {
            return b.rating - a.rating
        })
        console.log(sortMovies)

        //stringify() : javascript 데이터 -> json
        //parse() : json() -> javascript 데이터

        const jsonMovies = JSON.stringify(movies);
        console.log(typeof movies) //object
        console.log(typeof jsonMovies) //string

        //JOSN  데이터를 원래 데이터로 변환
        const newMovies = JSON.parse(jsonMovies);
        console.log(newMovies)

        //newMovies 데이터에서 평점이 8.5이상인 데이터만 출력
        const filterMovies = movies.filter((movie) => {
            return movie.rating >= 8.5
        })
        console.log(filterMovies)


    </script>

</body>

</html>
