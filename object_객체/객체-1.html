<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
</head>

<body>
    <script>
        //객체
        const person = {
            name: '홍길동',
            age: 25,
            city: '서울'
        }

        //배열
        const person2 = ["홍길동", "25", "서울"]

        //객체가 가지고 있는 정보를 가져올 때
        console.log(person.age);
        console.log(person["age"]);

        //배열의 값을 수정
        person2[2] = "부천";
        console.log(person2)


        //값을 변경 
        person.city = "부천"
        console.log(person.city)

        //새로운 값을 추가
        person.job = "학생";
        console.log(person)
    </script>
</body>

</html>
