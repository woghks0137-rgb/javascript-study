<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            background: gray;
        }

        .container {
            width: 300px;
            height: 200px;
            margin: auto;
            background: #ddd;
            border: 1px solid black;
            text-align: center;

        }


        #gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        #btn {
            background: darkblue;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            padding: 30px;
            margin-bottom: 30px;
        }

        img {
            width: 300px;
            height: 300px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>오늘의 상품</h1>
        <div class="card">
            <button id="btn">상품보기</button>
            <div id="gallery"></div>
        </div>
    </div>
    </div>

    <script>
        const products = [
            {
                title: '무드등',
                brand: "오늘의 집",
                price: 35000,
                stock: 12,
                image: "https://images.unsplash.com/photo-1620452590880-930188df814d?q=80&w=690&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            },
            {
                title: '침대',
                brand: "이케아",
                price: 2000000,
                stock: 3,
                image: "https://images.unsplash.com/photo-1617325247661-675ab4b64ae2?q=80&w=1171&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            },
            {
                title: '테이블',
                brand: "한샘",
                price: 500000,
                stock: 12,
                image: "https://images.unsplash.com/photo-1565791380713-1756b9a05343?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            }
        ];

        const btn = document.querySelector("#btn");
        const gallery = document.querySelector("#gallery");

        btn.addEventListener("click", () => {
            gallery.innerHTML = ''
            for (const product of products) {
                gallery.innerHTML += `
             <div class = 'card'>
                <img src="${product.image}">
                <div class = "info">
                    <h2>${product.title}</h2>
                    <p><strong>브랜드</strong>${product.brand}</p>
                    <p><strong>가격</strong>${product.price}</p>
                    <p><strong>재고</strong>${product.stock}</p>

                </div>
            </div>
            `
            }

        })

    </script>
</body>

</html>
