<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필카드 꾸미기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 50px 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f3f0eb;
            color: #333;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 40px;

            background: #fff;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 600;
        }

        .guide {
            margin: 12px 0 30px;
            text-align: center;
            color: #777;
        }

        /* 프로필 카드 */
        .profile-card {
            padding: 35px;
            text-align: center;

            background: #fff3dc;
            border-radius: 18px;

            transition: 0.3s;
        }

        .profile-card img {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 50%;
            border: 6px solid #fff;

            transition: 0.3s;
        }

        .profile-card h2 {
            margin: 20px 0 10px;
            font-size: 26px;
        }

        .profile-card p {
            min-height: 48px;

            line-height: 1.6;
            color: #555;
        }

        /* 이미지 숨김 클래스 */
        .profile-card img.hide {
            display: none;
        }

        /* 카드 색상 변경 클래스 */

        .profile-card.pink {
            background: #ffe4eb;
        }

        /* 버튼 */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 12px;
            margin-top: 25px;
        }

        .btn-group button {
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #555;
            color: #fff;

            font-size: 15px;

            transition: 0.2s;
        }

        .btn-group button:hover {
            background: #222;
            transform: translateY(-2px);
        }

        #reset-btn {
            background: #b46f54;
        }

        #reset-btn:hover {
            background: #94543c;
        }

        #profile-card.on {
            background: skyblue;
            color: #fff;
        }

        /* 실행 결과 */

        .result-box {
            margin-top: 25px;
            padding: 18px;

            border: 1px solid #ddd;
            border-radius: 12px;

            text-align: center;
        }

        .result-box span {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            color: #777;
        }

        .result-box strong {
            color: #b25b3f;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>함수로 프로필 꾸미기</h1>
        <p class="guide">
            버튼을 클릭해서 프로필 카드의 내용을 바꿔보세요.
        </p>
        <section class="profile-card" id="profile-card">
            <img src="https://images.unsplash.com/photo-1596492784531-6e6eb5ea9993?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fCVFQSVCMCU5NSVFQyU5NSU4NCVFQyVBNyU4MHxlbnwwfHwwfHx8MA%3D%3D"
                alt="강아지프로필" id="profile-image">
            <h2>테리</h2>
            <p id="profile-message">
                안녕하세요!! 저는 산책을 좋아하는 테리에요
            </p>
        </section>

        <!-- 기능 -->
        <div class="btn-group">
            <button id="message-btn">소개변경</button>
            <button id="color-btn">색상변경</button>
            <button id="image-btn">사진변경</button>
            <button id="reset-btn">초기화</button>
        </div>

        <!-- 함수실행 -->
        <div class="result-box">
            <span>실행된 함수</span>
            <strong id="result">아직 실행된 함수가 없습니다.</strong>
        </div>
    </main>

    <script>
        //선택자 변수
        const profileCard = document.querySelector("#profile-card"),
            profileImage = document.querySelector("#profile-image"),
            profileMessage = document.querySelector("#profile-message");

        //버튼
        const messageBtn = document.querySelector("#message-btn"),
            colorBtn = document.querySelector("#color-btn"),
            imageBtn = document.querySelector("#image-btn"),
            resetBtn = document.querySelector("#reset-btn");

        //실행결과
        const result = document.querySelector("#result");

        //소개구문을 변경하는 함수
        function changeMessage() {
            profileMessage.textContent = '산책과 공놀이 그리고 간식을 너무 좋아합니다. 간식 사주세요.'
            result.textContent = "changeMessage() 함수 실행"
        }
        messageBtn.addEventListener('click', changeMessage)

        //2. 색상변경 버튼을 클릭하면 changeColor()함수가 실행되면서 카드 색상이 토글로 동작
        function changeColor() {
            profileCard.classList.toggle('on')
            result.textContent = "changeColor() 함수 실행"
        }
        colorBtn.addEventListener("click", changeColor)

        //사진을 숨기거나 보여주는 함수
        function changeImage() {
            /*  profileImage.classList.toggle('hide') */
            profileImage.src = "https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fCVFQSVCMCU5NSVFQyU5NSU4NCVFQyVBNyU4MHxlbnwwfHwwfHx8MA%3D%3D"
            result.textContent = "changeImage() 함수 실행"
        }
        imageBtn.addEventListener("click", changeImage)

        //초기화
        function resetProfile() {
            profileMessage.textContent = '안녕하세요!! 저는 산책을 좋아하는 테리에요'
            profileCard.classList.remove("on");
            profileImage.src = 'https://images.unsplash.com/photo-1596492784531-6e6eb5ea9993?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fCVFQSVCMCU5NSVFQyU5NSU4NCVFQyVBNyU4MHxlbnwwfHwwfHx8MA%3D%3D'
            result.textContent = "아직 실행된 함수가 없습니다."
        }
        resetBtn.addEventListener('click', resetProfile)


    </script>
</body>

</html>
