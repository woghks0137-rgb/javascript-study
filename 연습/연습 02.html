<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: rgb(228, 226, 225);
        }

        li {
            list-style: none;
        }

        header {
            background: steelblue;
            padding: 20px;
            margin-bottom: 30px;
        }

        .text-group {
            width: 1200px;
            margin: 0 auto;
            color: #fff;
        }

        h1 {
            font-size: 40px;
        }

        .text-group {
            font-size: 22px;
        }

        .inner {
            width: 1200px;
            margin: 0 auto;
        }

        .event-text::before {
            display: inline-block;
            width: 6px;
            height: 60px;
            background: steelblue;
            content: '';
            margin-right: 15px;
            vertical-align: -23px;

        }

        .name {
            width: 250px;
            padding: 15px 30px;
            border-radius: 10px;
        }

        .btn {
            padding: 8px 12px;
            background: steelblue;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        .result {
            width: 80%;
            padding: 50px;
            border-radius: 20px;
            background: white;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            width: 300px;
            overflow: hidden;
            border-radius: 20px;
        }

        .card img {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .text-area {
            padding: 10px;
            background: lightgray;
        }

        span {
            font-size: 14px;
        }

        .text {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header>
        <div class="text-group">
            <h1>평가 2. 여행지 검색 </h1>
            <p class="text">find()로 조건에 맞는 데이터 한 개를 찾습니다.</p>
        </div>
    </header>
    <div class="inner">
        <p class="event-text">평가 목표 : input 값을 읽고 find()로 일치하는 객체 하나를 찾은 뒤 조건문으로 결과를 출력할 수 있는가?</p>
        <input type="text" class="name" placeholder="예 : 해운대"> <button class="btn">버튼

        </button>
        <ul class="card-list"></ul>

        <script>
            const cardList = document.querySelector(".card-list");
            const inputName = document.querySelector(".name");
            const btn = document.querySelector(".btn");
            const trips = [
                { id: 1, name: "성산일출봉", category: "제주", price: 120000, image: "https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=800&q=80", description: "제주의 아름다운 일출을 볼 수 있는 대표 관광지입니다." },
                { id: 2, name: "협재해수욕장", category: "제주", price: 150000, image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", description: "맑은 바다와 넓은 백사장이 아름다운 제주 여행지입니다." },
                { id: 3, name: "광안리", category: "부산", price: 100000, image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80", description: "광안대교 야경과 바다를 함께 즐길 수 있습니다." },
                { id: 4, name: "해운대", category: "부산", price: 130000, image: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80", description: "부산을 대표하는 해변 관광지입니다." },
                { id: 5, name: "안목해변", category: "강릉", price: 90000, image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80", description: "커피거리와 바다를 함께 즐길 수 있는 여행지입니다." },
                { id: 6, name: "경포대", category: "강릉", price: 110000, image: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80", description: "아름다운 호수와 동해 바다를 만날 수 있습니다." }
            ];

            btn.addEventListener("click", () => {
                const value = inputName.value;

                const trip = trips.find((item) => {
                    return item.name === value

                })
                if (trip) {
                    cardList.innerHTML = `
                     <li class = "card">
                    <img src ="${trip.image}">
                    <div class = "text-area">
                    <span>${trip.category}</span>
                    <h3 class = "text">${trip.name}</h3>    
                    <p class = "main-text">제주의 아름다운 일출을 볼 수 있는 대표</br>관강지입니다.</p>
                    <p class = "price">${trip.price.toLocaleString()}원</p>
                    </div>
                </li>
                    `
                }
                else {
                    cardList.textContent = "검색하신 내용이 없습니다."
                }
            })
        </script>
</body>

</html>
