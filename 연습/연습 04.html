<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습</title>
    <style>
        body {
            background: rgb(228, 226, 225);
        }

        li {
            list-style: none;
        }

        header {
            background: steelblue;
            padding: 20px;
            margin-bottom: 30px;
        }

        .text-group {
            width: 1200px;
            margin: 0 auto;
            color: #fff;
        }

        h1 {
            font-size: 40px;
        }

        .text-group {
            font-size: 22px;
        }

        .inner {
            width: 1200px;
            margin: 0 auto;
        }

        .event-text::before {
            display: inline-block;
            width: 6px;
            height: 60px;
            background: steelblue;
            content: '';
            margin-right: 15px;
            vertical-align: -23px;

        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            width: 300px;
            overflow: hidden;
            border-radius: 20px;
        }

        .card img {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .text-area {
            padding: 10px;
            background: lightgray;
        }

        span {
            font-size: 14px;
        }

        .text {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header>
        <div class="text-group">
            <h1>평가 4.여러 카테고리 필터 </h1>
            <p class="text">dataset으로 클릭한 버튼의 값을 가져옵니다.</p>
        </div>
    </header>
    <div class="inner">
        <p class="event-text">평가 목표 : querySelectorAll() , forEach() , dataset , filter()를 연결하여 여러 카테고리 버튼을 처리할 수 있는가?
        </p>
        <div class="btn-group">
            <button class="btn-all" data-category="전체">전체</button>
            <button class="btn-all" data-category="제주">제주</button>
            <button class="btn-all" data-category="부산">부산</button>
            <button class="btn-all" data-category="강릉">강릉</button>
        </div>
        <ul class="card-list"></ul>


        <script>
            const btnAll = document.querySelectorAll(".btn-all")
            const cardList = document.querySelector(".card-list")
            const trips = [
                { id: 1, name: "성산일출봉", category: "제주", price: 120000, image: "https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=800&q=80", description: "제주의 아름다운 일출을 볼 수 있는 대표 관광지입니다." },
                { id: 2, name: "협재해수욕장", category: "제주", price: 150000, image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", description: "맑은 바다와 넓은 백사장이 아름다운 제주 여행지입니다." },
                { id: 3, name: "광안리", category: "부산", price: 100000, image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80", description: "광안대교 야경과 바다를 함께 즐길 수 있습니다." },
                { id: 4, name: "해운대", category: "부산", price: 130000, image: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80", description: "부산을 대표하는 해변 관광지입니다." },
                { id: 5, name: "안목해변", category: "강릉", price: 90000, image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80", description: "커피거리와 바다를 함께 즐길 수 있는 여행지입니다." },
                { id: 6, name: "경포대", category: "강릉", price: 110000, image: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80", description: "아름다운 호수와 동해 바다를 만날 수 있습니다." }
            ];

            btnAll.forEach((button) => {
                button.addEventListener("click", () => {
                    const category = button.dataset.category

                    let trip

                    if (category === "전체") {
                        trip = trips;
                    } else {
                        trip = trips.filter((item) => {
                            return item.category === category
                        });
                    }
                    cardList.innerHTML = trip.map((item) => {
                        return `
           <li class="card">
            <img src="${item.image}" alt="${item.name}">
            <div class = "text-area">
            <span>${item.category}</span>
            <p class="main-text">${item.name}</p>
            <p class="sub-text">${item.description}</p>
            <p class="price">${item.price.toLocaleString()}원</p>
            </div>
            </li>
        `
                    }).join('')
                })
            })
        </script>
</body>

</html>
