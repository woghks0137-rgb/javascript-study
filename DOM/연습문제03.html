<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제</title>
</head>

<body>
    <div class="card">
        <h2>자기소개</h2>
        <p id="name">
            <span>이름 :</span>
            <span class="inputname"></span>
        </p>
        <p id="job">
            <span>직업 :</span>
            <span class="inputjob"></span>
        </p>
        <p id="hobby">
            <span>취미 :</span>
            <span class="inputhobby"></span>
        </p>

        <button id="btn">소개보기</button>

        <script>
            const inputName = document.querySelector(".inputname");
            const inputJob = document.querySelector(".inputjob");
            const inputHobby = document.querySelector(".inputhobby");
            const btn = document.querySelector("#btn");

            btn.addEventListener("click", function () {
                inputName.textContent = "김재환";
                inputJob.textContent = "학생";
                inputHobby.textContent = "운동";
            })

        </script>
    </div>
</body>

</html>
