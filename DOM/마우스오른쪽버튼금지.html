<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스 오른쪽 버튼 금지</title>
</head>

<body>
    <p>마우스 우클릭을 해보세요.</p>

    <script>
        window.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            alert('오른쪽 버튼을 사용할 수 없습니다.')
        })
    </script>
</body>

</html>
