<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필소개</title>
    <style>
        button,
        input,
        textarea {
            font: inherit;
        }

        .profile-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .profile-box {
            width: 100%;
            max-width: 520px;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin-bottom: 35px;
        }

        .title span {
            font-size: 13px;
            font-weight: bold;
            color: #6c5ce7;
        }

        .title h1 {
            margin: 8px 0;
            font-size: 30px;
        }

        .title p {
            margin: 0;
            color: #777;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .label-area {
            display: flex;
            justify-content: space-between;
        }

        .label-area span {
            color: #999;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        textarea {
            height: 130px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            border-color: #6c5ce7;
        }

        #saveBtn {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f7f7fa;
            border-radius: 10px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <main class="profile-wrap">
        <div class="profile-box">
            <div class="title">
                <span>PROFILE</span>
                <h1>프로필 작성</h1>
                <p>나를 소개하는 프로필을 작성하세요</p>
            </div>
            <div class="form-group">
                <label for="userName">이름</label>
                <input type="text" id="userName" placeholder="이름을 입력하세요">
            </div>

            <div class="form-group">
                <div class="label-area">
                    <label for="intro">자기소개</label>
                    <span>
                        <strong id="count">0</strong>/50
                    </span>
                </div>
                <textarea id="intro" maxlength="50" placeholder="간단한 자기 소개를 작성해주세요"></textarea>
            </div>
            <button id="saveBtn">프로필 저장</button>
            <div id="result" class="result">
                아직 작성된 프로필이 없습니다.
            </div>
        </div>
    </main>


    <script>
        //선택자 변수
        const userName = document.querySelector("#userName"),
            intro = document.querySelector("#intro"),
            count = document.querySelector("#count"),
            saveBtn = document.querySelector("#saveBtn"),
            result = document.querySelector("#result");

        //자기 소개를 입력할 때마다 실행
        intro.addEventListener("input", () => {
            //현재 입력한 글자수
            count.textContent = intro.value.length;
        })

        //저장버튼
        saveBtn.addEventListener('click', () => {
            const nameValue = userName.value;
            const introValue = intro.value;
            // console.log("nameValue:", nameValue)
            //console.log("introValue:", introValue)

            if (nameValue === '' || introValue === '') {
                alert("이름과 자기소개를 모두 입력해주세요");
                return; //현재 실행문을 종료
            }

            //입력된 내용을 result에 출력 => html요소로
            result.innerHTML = `
                <strong>${nameValue}</strong>
                <p>${introValue}</p>
            `
        })
    </script>
</body>

</html>
